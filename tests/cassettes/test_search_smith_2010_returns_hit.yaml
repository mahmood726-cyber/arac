        AND PUB_YEAR:2010\",\"resultType\":\"core\",\"cursorMark\":\"*\",\"pageSize\":1,\"sort\":\"\",\"synonym\":false},\"resultList\":{\"result\":[{\"id\":\"38588373\",\"source\":\"MED\",\"pmid\":\"38588373\",\"title\":\"Rapid
        Changes in Teaching and Learning: The Response of Teachers and Students in
        Dual Credit Courses to Online Learning During the COVID-19 Pandemic\",\"authorString\":\"Glennie
        EJ, Smith WZ.\",\"authorList\":{\"author\":[{\"fullName\":\"Glennie EJ\",\"firstName\":\"Elizabeth
        J.\",\"lastName\":\"Glennie\",\"initials\":\"EJ\"},{\"fullName\":\"Smith WZ\",\"firstName\":\"W.
        Zach\",\"lastName\":\"Smith\",\"initials\":\"WZ\"}]},\"pubYear\":\"2010\",\"abstractText\":\"In
        spring 2020, the COVID-19 pandemic forced schools to switch quickly to online
        learning. Before then, Hawai\u02BBi had been expanding its dual credit program,
        in which high school students could take courses that would yield both high
        school and college credits. These dual credit programs require partnerships
        between high schools and colleges. RTI International conducted a multi-method
        analysis to examine the effect of this COVID-19\u2013based transition to online
        learning on the dual credit, analyzing data from the state longitudinal data
        system and conducting surveys and focus groups of the University of Hawai\u02BBi\u2019s
        instructors, high school coordinators, and high school staff involved with
        program. From spring 2020 to fall 2020, students took some dual enrollment
        courses even though offerings and enrollment declined; offerings and enrollment
        rebounded by spring 2021. The percentage of course-takers earning both high
        school and college credit remained about the same during this transition.
        Examining outcomes for student and school subgroups shows that male students
        struggled more than female students did with enrollment during this transition,
        and students in rural schools had a steeper decline in the rate of earning
        both high school and college credits. However, both groups did begin to recover
        by spring 2021.\",\"publicationStatus\":\"ppublish\",\"language\":\"eng\",\"pubTypeList\":{\"pubType\":[\"Review\"]},\"bookOrReportDetails\":{\"publisher\":\"RTI
